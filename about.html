<!DOCTYPE html>
<html>
<head>
  <title>Home</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<style>
body{
  margin: 0;
  background-image: url("Sky.gif");
  background-repeat: repeat;
  background-size: auto;
}
.menu{
  position: fixed;
  top: 20px;
  width: 100%;
  text-align: center;
  padding: 2px 0;
  border-top: 5px solid white;
  border-bottom: 5px solid white;
background: linear-gradient(
  to bottom,
  #dfdfdf,
  #c0c0c0,
  #a0a0a0
);
}
.menu a{
  display: inline-block;
  margin: 15px;
  padding: 10px 15px;
  background: #c0c0c0;
  color: black;
  text-decoration: none;
  font-size: 15px;
  font-family: Tahoma, Arial, sans-serif;
  border: 2px solid;
  border-color: #ffffff #808080 #808080 #ffffff;
  box-shadow: 1px 1px 0 #000000;
}
.menu a:hover{
  background: #dcdcdc;
}
.menu a:active{
  border-color: #808080 #ffffff #ffffff #808080;
  box-shadow: inset 1px 1px 0 #000000;
}
#Boo {
  position: fixed; /* Faz ele flutuar sobre a tela, ignorando a rolagem */
  top: 0;
  left: 0;
  font-size: 50px; /* Tamanho do fantasma. Se for imagem, use width/height */
  z-index: 9999; /* Garante que ele fique por cima de todos os elementos */
  pointer-events: none; /* Impede que ele atrapalhe o clique do mouse em links */
  user-select: none; /* Impede que o usuário selecione o fantasma */
}
  </style>
</head>
<body>
  <div id="Boo">👻</div>
<div class="menu">
  <a href="index.html">Home</a>
  <a href="about.html">About</a>
  <a href="artwork.html">Gallery</a>
  <a href="redes.html">Projects</a>
  <a href="links.html">Social</a>
  <a href="lojinha.html">Store</a>
  <a href="news.html">News!</a>
</div>
  <script>
   // Espera o HTML carregar completamente antes de rodar a mágica
document.addEventListener("DOMContentLoaded", () => {
  
  const fantasma = document.getElementById('fantasminha');

  // Posição inicial do fantasma (um pouco mais pro meio para evitar bugar no canto)
  let posX = 50;
  let posY = 50;

  // Velocidade
  let velocidadeX = 2.5;
  let velocidadeY = 2.5;

  function animarFantasma() {
    const larguraTela = window.innerWidth;
    const alturaTela = window.innerHeight;
    
    const larguraFantasma = fantasma.offsetWidth;
    const alturaFantasma = fantasma.offsetHeight;

    posX += velocidadeX;
    posY += velocidadeY;

    // --- LÓGICA DE BATER NA DIREITA OU ESQUERDA ---
    if (posX + larguraFantasma >= larguraTela) {
      posX = larguraTela - larguraFantasma; // Força ele a não passar da tela
      velocidadeX = -Math.abs(velocidadeX); 
      fantasma.style.transform = "scaleX(1)"; 
    } else if (posX <= 0) {
      posX = 0; // Força ele a não passar da tela
      velocidadeX = Math.abs(velocidadeX); 
      fantasma.style.transform = "scaleX(-1)"; 
    }

    // --- LÓGICA DE BATER EM CIMA OU EMBAIXO ---
    if (posY + alturaFantasma >= alturaTela) {
      posY = alturaTela - alturaFantasma; // Força ele a não passar da tela
      velocidadeY = -Math.abs(velocidadeY); 
    } else if (posY <= 0) {
      posY = 0; // Força ele a não passar da tela
      velocidadeY = Math.abs(velocidadeY); 
    }

    fantasma.style.left = posX + 'px';
    fantasma.style.top = posY + 'px';

    requestAnimationFrame(animarFantasma);
  }

  // Inicia a animação
  animarFantasma();
});
  </script>
</body>
</html>
