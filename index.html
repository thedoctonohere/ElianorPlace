<!DOCTYPE html>
<html>
<head>
  <title>Home</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<style>
body{
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  background-image: url("Sky.gif");
  background-repeat: repeat;
  background-size: auto;
  font-family: Tahoma, Arial, sans-serif;
}
.menu{
  position: relative;
  top: 20px;
  width: 100%;
  text-align: center;
  padding: 2px 0;
  border-top: 5px solid white;
  border-bottom: 5px solid white;
background: linear-gradient(
  to bottom,
  #dfdfdf,
  #c0c0c0,
  #a0a0a0
);
}
.menu a{
  display: inline-block;
  margin: 15px;
  padding: 10px 15px;
  background: #c0c0c0;
  color: black;
  text-decoration: none;
  font-size: 15px;
  font-family: Tahoma, Arial, sans-serif;
  border: 2px solid;
  border-color: #ffffff #808080 #808080 #ffffff;
  box-shadow: 1px 1px 0 #000000;
}
.menu a:hover{
  background: #dcdcdc;
}
.menu a:active{
  border-color: #808080 #ffffff #ffffff #808080;
  box-shadow: inset 1px 1px 0 #000000;
}
.janela {
  position: relative;
  width: 90%;
  max-width: 800px;
  min-height: 500px; 
  margin: 120px auto 40px auto;
  background: #c0c0c0;
  border: 2px solid;
  border-color: #ffffff #808080 #808080 #ffffff;
  box-shadow: 3px 3px 0 #000;
}
.conteudo {
  padding: 10px;
  min-height: 400px;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

.carrossel {
  flex: 1; /* Faz o GIF ocupar o máximo de espaço e empurrar o resto para baixo */
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 10px;
}
.carrossel img {
  width: 80%;
  height: auto;
  min-height: 200px;
  object-fit: contain;
  border: 2px solid black;
  background: #000;
  display: block; /* Remove espaços vazios embaixo da imagem */
}

.seta {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 30px;
  background: rgba(0, 0, 0, 0.5);
  color: white;
  padding: 10px;
  cursor: pointer;
  z-index: 15;
  
  /* Esconde por padrão */
  opacity: 0; 
  transition: opacity 0.3s ease;
}

/* Mostra as setas quando o mouse passa no carrossel */
.carrossel:hover .seta {
  opacity: 1;
}

.seta.esq {
  left: 0; /* Cola na borda esquerda da imagem */
}

.seta.dir {
  right: 0; /* Cola na borda direita da imagem */
}

.seta:hover {
  background: rgba(0, 0, 0, 0.8);
}
.descricao {
  font-size: 16px;
  font-weight: bold;
  padding: 10px;
  background: #b0b0b0; /* Cor levemente diferente para destacar */
  border: 2px inset #ffffff;
  text-align: center;
  margin-top: auto; /* Cola na base do conteúdo */
  transition: transform 0.3s ease-in-out;
  z-index: 12;
}

.lista-gifs {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 95px;
  background: #c0c0c0;
  border-top: 2px solid #808080;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px 10px;
  box-sizing: border-box;
  overflow-x: auto;
  z-index: 11;
  
  /* Começa escondida 100% para baixo */
  transform: translateY(100%);
  transition: transform 0.3s ease-in-out;
}
.janela:hover .descricao {
  transform: translateY(-90px); /* Sobe a legenda */
}

.janela:hover .lista-gifs {
  transform: translateY(0); /* Mostra a lista */
}.newspop {
  position: relative; /* Janela é a base */
  width: 90%;
  max-width: 300px;
  background: #c0c0c0; /* O fundo cinza que vai cobrir ela */
  border: 2px solid;
  border-color: #ffffff #808080 #808080 #ffffff;
  box-shadow: 3px 3px 0 #000;
  z-index: 10;
  
  /* CRUCIAL: Cria o espaço para ela ficar atrás do fundo */
  transform-style: preserve-3d; 
}

.elianora {
  position: absolute;
  /* Posiciona ela no topo, saindo para fora da caixa */
  top: -120px; 
  left: 50%;
  transform: translateX(-50%) translateZ(-1px); /* O -1px coloca ela atrás do fundo cinza */
  pointer-events: none;
  z-index: -1; 
}
.elianora img {
  width: 100px !important; 
  height: auto;
  display: block; 
}
.barra{
  background: linear-gradient(to right, #000080, #1084d0);
  color: white;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 5px;
  box-sizing: border-box;
}
.titulo{
  font-size: 13px;
  font-weight: bold;
  font-family: Tahoma, Arial, sans-serif;
}
.botoes-janela{
  display: flex;
  align-items: center;
  gap: 2px;
}
.botoes-janela{
  display: flex;
  gap: 2px;
}
.botao{
  width: 40px;
  height: 18px;
  background: #c0c0c0;
  border: 2px solid;
  border-color: #ffffff #808080 #808080 #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
}
.fechar{
  background: #c05050;
}
.botao img{
  width: 10px;
  height: 10px;
  image-rendering: pixelated;
}
.botao:hover{
  filter: brightness(1.1);
}
.botao:active {
  border-color: #808080 #ffffff #ffffff #808080; /* Inverte o brilho e a sombra */
}
.newstext{
  padding: 5px;
  font-size: 13px;
  font-weight: bold;
}
.about{
  position: relative;
  width: 90%;
  max-width: 500px;
  margin: 0;
  background: #c0c0c0;
  border: 2px solid;
  border-color: #ffffff #808080 #808080 #ffffff;
  box-shadow: 3px 3px 0 #000;
}
.aboutitlle{
  background: linear-gradient(to right, #000080, #1084d0);
  color: white;
  padding: 5px;
  font-size: 13px;
  font-weight: bold;
}
 .banners{
  width: 100%;
  text-align: center;
  padding: 10px 0;
  margin-top: 40px;
  margin-bottom: 10px;
}
.banners img{
  width: 88px;
  height: 31px;
  margin: 2px;
}
.player{
  position: fixed;
  left: 20px;
  bottom: 20px;
  width: 320px;
  max-width: 90vw;
  height: 80px;
  background: #c0c0c0;
  border: 2px solid;
  border-color: #ffffff #808080 #808080 #ffffff;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px;
  box-sizing: border-box;
  perspective: 1000px;
  z-index: 9999;
}
.disco{
  width: 55px;
  height: 55px;
  image-rendering: pixelated;
  animation: virar 5s infinite ease-in-out;
  transform-style: preserve-3d;
}
@keyframes virar{
  0%{
    transform: rotateY(0deg);
  }
  50%{
    transform: rotateY(180deg);
  }
  100%{
    transform: rotateY(360deg);
  }
}
.info-musica{
  flex: 1;
  background: black;
  color: #00ff00;
  font-family: monospace;
  font-size: 12px;
  padding: 5px;
  border: 2px inset #808080;
}
.player button{
  width: 30px;
  height: 30px;
  background: #c0c0c0;
  border: 2px solid;
  border-color: #ffffff #808080 #808080 #ffffff;
  cursor: pointer;
}
.player button:active{
  border-color: #808080 #ffffff #ffffff #808080;
}
.layout-topo{
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 20px;
  flex-wrap: wrap;
  margin-top: 140px;
  padding: 20px;
  box-sizing: border-box;
}
  </style>

<script>
const playlist = [
  {
    nome: "JerryTerry - ReDoin.mp3",
    arquivo: "ReDoin.mp3",
    capa: "ReDoin.jpg"
  },
  {
    nome: "Seatbelts - Cats on Mars.mp3",
    arquivo: "catsonmars.mp3",
    capa: "catsonmars.jpg"
  },
  {
    nome: " Kingsley Scanlon - Nostalgia.mp3",
    arquivo: "nostalgia.mp3",
    capa: "nostalgia.jpg"
  }
];
let musicindex = 0;
const audio = document.getElementById("musica");
const nome = document.getElementById("nomeMusica");
const capa = document.getElementById("capa");
const playBtn = document.getElementById("play");
let tocando = false;
function atualizarPlayer(){
  audio.src = playlist[index].arquivo;
  nome.innerHTML = playlist[index].nome;
  capa.src = playlist[index].capa;
}
function proximaMusica(){
  index = (index + 1) % playlist.length;
  atualizarPlayer();
  audio.play();
  tocando = true;
  playBtn.innerHTML = "❚❚";
}
document.getElementById("proxima").onclick = () => {
  proximaMusica();
};
document.getElementById("anterior").onclick = () => {
  index = (index - 1 + playlist.length) % playlist.length;
  atualizarPlayer();
  audio.play();
  tocando = true;
  playBtn.innerHTML = "❚❚";
};
playBtn.onclick = () => {
  if(tocando){
    audio.pause();
    tocando = false;
    playBtn.innerHTML = "▶";
  }
  else{
    audio.play();
    tocando = true;
    playBtn.innerHTML = "❚❚";
  }
};
audio.onended = () => {
  proximaMusica();
};
atualizarPlayer();
</script>
<script>
const gifs = [
  {
    img: "spooky_dance.gif",
    texto: "Ainda é a versão de teste desculpe :P"
  }
];

let index = 0;

const img = document.getElementById("gifPrincipal");
const desc = document.getElementById("descricao");

function atualizar(){
  img.src = gifs[index].img;
  desc.textContent = gifs[index].texto;
}

// botão direita
document.querySelector(".seta.dir").onclick = () => {
  index = (index + 1) % gifs.length;
  atualizar();
};

// botão esquerda
document.querySelector(".seta.esq").onclick = () => {
  index = (index - 1 + gifs.length) % gifs.length;
  atualizar();
};

// clicar nos pequenos
document.querySelectorAll(".lista-gifs img").forEach((el, i) => {
  el.onclick = () => {
    index = i;
    atualizar();
  };
});
</script>
