<!DOCTYPE html>
<html>
<head>
  <title>Welcome</title>
</head>
<style>
body{
  margin: 0;
  background-image: url("Sky.gif");
  background-repeat: repeat;
  background-size: auto;
}
  .banners{
  position: fixed;
  bottom: 0;
  width: 100%;
  text-align: center;
  padding: 5px;
}

.banners img{
  width: 88px;
  height: 31px;
  margin: 2px;
}
.corda-topo,
.corda-baixo{
  position: fixed;
  left: 0;
  width: 100%;
  height: 32px; /* altura do gif */
  background-image: url("i_just_say_hi.gif");
  background-repeat: repeat-x;
  background-size: auto 32px;
  z-index: 999;
}

.corda-topo{
  top: 0;
}

.corda-baixo{
  bottom: 0;
}
  
  .janela{
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 700px;
  height: 450px;
  background: #c0c0c0;
  border: 2px solid #ffffff;
  box-shadow: inset -2px -2px #808080,
              inset 2px 2px #dfdfdf,
              4px 4px 10px rgba(0,0,0,0.4);
  font-family: Arial, sans-serif;
}

.barra-titulo{
  background: linear-gradient(to right, #000080, #1084d0);
  color: white;
  padding: 6px;
  font-weight: bold;
  font-size: 14px;
}

.conteudo{
  padding: 15px;
  color: black;
}
  .elianora{
  position: absolute;
  top: 60%;
  left: 70%;
  transform: translate(-50%, -50%);
}

.elianora img{
  width: 120px; /* tamanho da personagem */
}

/* balão de fala */
.balao{
  max-width: 150px;   /* controla a largura */
  padding: 6px;
  font-size: 12px;
  line-height: 1.2;
  position: absolute;
  top: 20px;       /* ajusta a posição do balão */
  left: 130px;     /* lado da personagem */
  background: white;
  border: 2px solid black;
  padding: 8px;
  border-radius: 8px;
  font-size: 12px;
}

/* pontinha */
.balao::after{
  content: "";
  position: absolute;
  top: 100px;       /* altura da ponta */
  left: -10px;     /* faz sair do lado esquerdo */
  border-width: 10px;
  border-style: solid;
  border-color: transparent white transparent transparent;
}
</style>

</head>
<body>
<div class="corda-topo"></div>

  <div class="banners">
  <img src="gorillaz_ddays.gif">
  <img src="spooky_dance.gif">
  <img src="perigo_java.gif">
  <img src="possummm.gif">
  <img src="github.gif">
  <img src="deletechrome3.png">
  <img src="binema.png">
  <img src="under_construction.gif">
  <img src="100percenthuman.gif">
</div>
  
  <div class="janela">
  <div class="barra-titulo">
   Alerta!!!
  </div>

  <div class="conteudo">
    Bem Vindo!...<br>
    Então...<br>
    Acho que você chegou um pouco cedo mas em breve teremos atualizações aqui<br>
    fique ligado!!!
  </div>
</div>
  <div class="elianora">
  <div class="balao">
    Olá, eu me chamo elianora
    Bem vindo!!!
    O site foi atualizado dia 04/05/2026
  </div>
  <img src="Elianora_chib.png">
</div>
</body>
</html>
