<style>

.newstext{
  padding: 5px;
  font-size: 13px;
  font-weight: bold;
}
.barra{
  background: linear-gradient(to right, #000080, #1084d0);

  color: white;

  height: 28px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 5px;

  box-sizing: border-box;
}
.titulo{
  font-size: 13px;
  font-weight: bold;
  font-family: Tahoma, Arial, sans-serif;
}
.botoes-janela{
  display: flex;
  align-items: center;
  gap: 2px;
}
.botoes-janela{
  display: flex;
  gap: 2px;
}
.botao{
  width: 40px;
  height: 18px;

  background: #c0c0c0;

  border: 2px solid;
  border-color: #ffffff #808080 #808080 #ffffff;

  display: flex;
  align-items: center;
  justify-content: center;

  box-sizing: border-box;
}
.fechar{
  background: #c05050;
}
.botao img{
  width: 10px;
  height: 10px;

  image-rendering: pixelated;
}
.botao:hover{
  filter: brightness(1.1);
}
.botao:active{
  border-color: #808080 #ffffff #ffffff #808080;
}
.player-container{

  position: fixed;

  bottom: 20px;

  right: -320px;

  display: flex;

  align-items: center;

  transition: 0.4s;

  z-index: 99999;
}
.player-container.aberto{
  right: 0;
}
.toggle-player{

  width: 35px;

  height: 80px;

  background: #c0c0c0;

  border: 2px solid;
  border-color: #ffffff #808080 #808080 #ffffff;

  display: flex;

  align-items: center;

  justify-content: center;

  cursor: pointer;

  font-size: 20px;

  user-select: none;
}
.player{

  width: 320px;

  height: 80px;

  background: #c0c0c0;

  border: 2px solid;
  border-color: #ffffff #808080 #808080 #ffffff;

  display: flex;

  align-items: center;

  gap: 10px;

  padding: 8px;

  box-sizing: border-box;
}
  .info-musica{
  flex: 1;
  background: black;
  color: #00ff00;
  font-family: monospace;
  font-size: 12px;
  padding: 5px;
  border: 2px inset #808080;
}
.disco{

  width: 55px;

  height: 55px;

  min-width: 55px;

  image-rendering: pixelated;

  animation: virar 5s ease-in-out infinite;

  transform-style: preserve-3d;
}
@keyframes virar{

  0%{
    transform: perspective(500px) rotateY(0deg);
  }

  50%{
    transform: perspective(500px) rotateY(180deg);
  }

  100%{
    transform: perspective(500px) rotateY(360deg);
  }
}
  </style>
</head>
<body>
  <div class="newspop">
<div class="barra">

  <div class="titulo">
    Updates do Sistema
  </div>
<div class="botoes-janela">

  <div class="botao">
    <img src="minimizar.png">
  </div>

  <div class="botao">
    <img src="maximizar.png">
  </div>

  <div class="botao fechar">
    <img src="fechar.png">
  </div>
</div>
</div>
<div class="newstext">
    Bem Vindo!!!<br>
   Esta á minha primeira fazendo um site então vai ter muitos erros principalmente com compatibilidade com 
   outros tipos de telas espero que goste não esqueça de passar nas minhas redes socias 
    </div>
</div>
  </div>
<div class="menu">
  <a href="index.html">Home</a>
  <a href="about.html">About</a>
  <a href="artwork.html">Gallery</a>
  <a href="redes.html">Projects</a>
  <a href="links.html">Social</a>
  <a href="news.html">News!</a>
</div>
<div class="player-container" id="playerContainer">

  <div class="toggle-player" id="togglePlayer">
    ◀
  </div>

  <div class="player">

    <img src="redoin.jpg" class="disco" id="capa">

    <div class="info-musica">
      <marquee id="nomeMusica">
        Elianora - Lost Memories.mp3
      </marquee>
    </div>

    <button id="anterior">◀◀</button>
    <button id="play">▶</button>
    <button id="proxima">▶▶</button>

    <audio id="musica"></audio>

  </div>

</div>
<script>
const playlist = [
  {
    nome: "JerryTerry - ReDoin.mp3",
    arquivo: "ReDoin.mp3",
    capa: "redoin.jpg"
  },
  {
    nome: "Seatbelts - Cats on Mars.mp3",
    arquivo: "catsonmars.mp3",
    capa: "catsonmars.jpg"
  },
  {
    nome: " Kingsley Scanlon - Nostalgia.mp3",
    arquivo: "nostalgia.mp3",
    capa: "nostalgia.jpg"
  }
];
let index = 0;
const audio = document.getElementById("musica");
const nome = document.getElementById("nomeMusica");
const capa = document.getElementById("capa");
const playBtn = document.getElementById("play");
let tocando = false;
function atualizarPlayer(){
  audio.src = playlist[index].arquivo;
  nome.innerHTML = playlist[index].nome;
  capa.src = playlist[index].capa;
}
function proximaMusica(){
  index = (index + 1) % playlist.length;
  atualizarPlayer();
  audio.play();
  tocando = true;
  playBtn.innerHTML = "❚❚";
}
document.getElementById("proxima").onclick = () => {
  proximaMusica();
};
document.getElementById("anterior").onclick = () => {
  index = (index - 1 + playlist.length) % playlist.length;
  atualizarPlayer();
  audio.play();
  tocando = true;
  playBtn.innerHTML = "❚❚";
};
playBtn.onclick = () => {
  if(tocando){
    audio.pause();
    tocando = false;
    playBtn.innerHTML = "▶";
  }
  else{
    audio.play();
    tocando = true;
    playBtn.innerHTML = "❚❚";
  }
};
audio.onended = () => {
  proximaMusica();
};
atualizarPlayer();
const togglePlayer = document.getElementById("togglePlayer");
const playerContainer = document.getElementById("playerContainer");

let aberto = false;

togglePlayer.onclick = () => {

  aberto = !aberto;

  if(aberto){

    playerContainer.classList.add("aberto");

    togglePlayer.innerHTML = "▶";
  }
  else{

    playerContainer.classList.remove("aberto");

    togglePlayer.innerHTML = "◀";
  }
};
</script>
</body>
</html>
