<!DOCTYPE html>
<html>
<head>
  <title>Projects</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      background-image: url("Sky.gif");
      background-repeat: repeat;
      background-size: auto;
      font-family: Tahoma, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Menu Superior Original */
    .menu {
      position: fixed;
      top: 20px;
      width: 100%;
      text-align: center;
      padding: 2px 0;
      border-top: 5px solid white;
      border-bottom: 5px solid white;
      background: linear-gradient(
        to bottom,
        #dfdfdf,
        #c0c0c0,
        #a0a0a0
      );
      z-index: 10;
    }

    .menu a {
      display: inline-block;
      margin: 15px;
      padding: 10px 15px;
      background: #c0c0c0;
      color: black;
      text-decoration: none;
      font-size: 15px;
      font-family: Tahoma, Arial, sans-serif;
      border: 2px solid;
      border-color: #ffffff #808080 #808080 #ffffff;
      box-shadow: 1px 1px 0 #000000;
    }

    .menu a:hover {
      background: #dcdcdc;
    }

    .menu a:active {
      border-color: #808080 #ffffff #ffffff #808080;
      box-shadow: inset 1px 1px 0 #000000;
    }

    /* POP-UP RETRÔ */
    .retro-popup {
      width: 320px;
      background-color: #c0c0c0;
      border: 3px solid;
      border-color: #ffffff #808080 #808080 #ffffff;
      box-shadow: 2px 2px 0px #000;
      padding: 3px;
      margin-top: 80px; 
    }

    /* Barra de Título da Janela */
    .title-bar {
      background: linear-gradient(90deg, #000080, #1084d0);
      color: white;
      padding: 3px 4px 3px 6px;
      font-weight: bold;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* QUADRADINHOS DOS BOTÕES DA JANELA */
    .window-controls {
      display: flex;
      gap: 2px;
    }

    .window-btn {
      background-color: #c0c0c0;
      border: 2px solid;
      border-color: #ffffff #808080 #808080 #ffffff; /* Borda 3D saltada */
      padding: 1px 2px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .window-btn:active {
      border-color: #808080 #ffffff #ffffff #808080; /* Borda afundada ao clicar */
      padding: 2px 1px 0px 3px; /* Empurra o ícone levemente para baixo/direita dando efeito de clique */
    }

    .window-btn img {
      width: 12px;  /* Tamanho ajustado para caber no quadradinho */
      height: 12px;
      display: block;
      image-rendering: pixelated;
    }

    /* Conteúdo do Pop-up */
    .popup-content {
      padding: 15px;
      text-align: center;
    }

    .popup-text {
      font-size: 12px;
      color: #000;
      margin-top: 0;
      margin-bottom: 15px;
      line-height: 1.4;
    }

    /* Caixinha afundada das redes sociais */
    .links-container {
      background-color: #ffffff;
      border: 2px solid;
      border-color: #808080 #ffffff #ffffff #808080;
      padding: 12px 5px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .link-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      transition: transform 0.1s;
    }

    .link-item:hover {
      transform: scale(1.08);
    }

    .link-item img {
      width: 48px;  
      height: 48px; 
      object-fit: contain;
      image-rendering: pixelated;
    }

    .link-label {
      font-size: 11px;
      color: #000;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <!-- Menu de Navegação -->
  <div class="menu">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="artwork.html">Gallery</a>
    <a href="redes.html">Projects</a>
    <a href="links.html">Social</a>
    <a href="news.html">News!</a>
  </div>

  <!-- POP-UP RETRÔ DE LINKS -->
  <div class="retro-popup">
    
    <div class="title-bar">
      <span>meus_links.exe</span>
      
      <!-- Quadradinhos dos botões da janela com os PNGs dentro -->
      <div class="window-controls">
        <div class="window-btn">
          <img src="minimizar.png" alt="Minimizar">
        </div>
        <div class="window-btn">
          <img src="maximizar.png" alt="Expandir">
        </div>
        <div class="window-btn" style="margin-left: 2px;">
          <img src="fechar.png" alt="Fechar">
        </div>
      </div>
    </div>

    <div class="popup-content">
      <p class="popup-text">
        bem-vindo ao meu cantinho! <br>
        clique abaixo para me acompanhar:
      </p>

      <div class="links-container">
        
        <!-- Link 1: Instagram -->
        <a href="https://instagram.com/SEU_USUARIO" target="_blank" class="link-item">
          <img src="SUA_IMAGEM_INSTAGRAM.png" alt="Instagram">
          <span class="link-label">Instagram</span>
        </a>

        <!-- Link 2: TikTok -->
        <a href="https://tiktok.com/@SEU_USUARIO" target="_blank" class="link-item">
          <img src="SUA_IMAGEM_TIKTOK.png" alt="TikTok">
          <span class="link-label">TikTok</span>
        </a>

        <!-- Link 3: Outra Rede / Site -->
        <a href="https://SEU_OUTRO_LINK.com" target="_blank" class="link-item">
          <img src="SUA_IMAGEM_OUTRA.png" alt="Link">
          <span class="link-label">Outro</span>
        </a>

      </div>
    </div>

  </div>

</body>
</html>
