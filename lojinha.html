<!DOCTYPE html>
<html>
<head>
  <title>Store - Retro Projects</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      background-image: url("Sky.gif");
      background-repeat: repeat;
      background-size: auto;
      font-family: Tahoma, Arial, sans-serif;
      /* Aumentei o espaço no topo para 130px para afastar bem do menu */
      padding-top: 130px; 
      padding-bottom: 40px;
    }

    /* ====== MENU ====== */
    .menu {
      position: fixed;
      top: 20px;
      width: 100%;
      text-align: center;
      padding: 2px 0;
      border-top: 5px solid white;
      border-bottom: 5px solid white;
      background: linear-gradient(
        to bottom,
        #dfdfdf,
        #c0c0c0,
        #a0a0a0
      );
      z-index: 10;
    }

    .menu a {
      display: inline-block;
      margin: 10px;
      padding: 10px 15px;
      background: #c0c0c0;
      color: black;
      text-decoration: none;
      font-size: 15px;
      font-family: Tahoma, Arial, sans-serif;
      border: 2px solid;
      border-color: #ffffff #808080 #808080 #ffffff;
      box-shadow: 1px 1px 0 #000000;
    }

    .menu a:hover {
      background: #dcdcdc;
    }

    .menu a:active {
      border-color: #808080 #ffffff #ffffff #808080;
      box-shadow: inset 1px 1px 0 #000000;
    }

    /* ====== VITRINE DE PRODUTOS ====== */
    .store-container {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }

    .product-card {
      width: 200px;
      background-color: #c0c0c0;
      border: 3px solid;
      border-color: #ffffff #808080 #808080 #ffffff;
      padding: 3px; /* Reduzido para acomodar a barra de título */
      text-align: center;
      cursor: pointer;
      box-shadow: 2px 2px 0px #000;
      transition: transform 0.1s;
    }

    .product-card:active {
      border-color: #808080 #ffffff #ffffff #808080;
      transform: translateY(2px);
    }

    /* Título do produto com cara de arquivo do topo da janelinha */
    .card-title-bar {
      background: linear-gradient(90deg, #000080, #1084d0);
      color: white;
      padding: 3px 6px;
      font-weight: bold;
      font-size: 12px;
      text-align: left;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Conteúdo do produto abaixo da barra azul */
    .card-content {
      padding: 0 10px 10px 10px;
    }

    .img-container {
      background-color: #fff;
      border: 2px solid;
      border-color: #808080 #ffffff #ffffff #808080;
      padding: 5px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    .img-container img {
      max-width: 100%;
      max-height: 100%;
      image-rendering: pixelated;
    }

    .product-desc {
      font-size: 11px;
      margin: 0;
      color: #333;
      height: 35px;
      overflow: hidden;
    }

    .product-price-card {
      font-size: 15px;
      font-weight: bold;
      color: #008000;
      margin: 8px 0 0 0;
    }

    /* ====== FUNDO ESCURO DO POP-UP (OVERLAY) ====== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.7); 
      display: none; 
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    /* ====== POP-UP DO PRODUTO ====== */
    .retro-popup {
      width: 300px;
      background-color: #c0c0c0;
      border: 3px solid;
      border-color: #ffffff #808080 #808080 #ffffff;
      box-shadow: 2px 2px 0px #000;
      padding: 3px;
    }

    .title-bar {
      background: linear-gradient(90deg, #000080, #1084d0);
      color: white;
      padding: 3px 4px 3px 6px;
      font-weight: bold;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* BOTÕES DA JANELA */
    .botoes-janela {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .botao {
      width: 40px;
      height: 18px;
      background: #c0c0c0;
      border: 2px solid;
      border-color: #ffffff #808080 #808080 #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      cursor: pointer;
    }

    .fechar {
      background: #c05050;
    }

    .botao img {
      width: 10px;
      height: 10px;
      image-rendering: pixelated;
    }

    .botao:hover {
      filter: brightness(1.1);
    }

    .botao:active {
      border-color: #808080 #ffffff #ffffff #808080;
    }

    /* Conteúdo interno do Pop-up */
    .popup-content {
      padding: 15px;
      text-align: center;
      background: #c0c0c0;
    }

    .popup-content img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border: 2px solid;
      border-color: #808080 #ffffff #ffffff #808080;
      margin-bottom: 10px;
      background: #fff;
    }

    .popup-price {
      font-size: 20px;
      font-weight: bold;
      color: #008000; 
      margin: 10px 0;
    }

    .btn-comprar {
      display: block;
      margin: 15px auto 5px auto;
      padding: 8px 15px;
      background: #c0c0c0;
      color: black;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      border: 2px solid;
      border-color: #ffffff #808080 #808080 #ffffff;
    }

    .btn-comprar:active {
      border-color: #808080 #ffffff #ffffff #808080;
      box-shadow: inset 1px 1px 0 #000000;
    }
  </style>
</head>
<body>

  <!-- MENU SUPERIOR -->
  <div class="menu">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="artwork.html">Gallery</a>
    <a href="redes.html">Projects</a>
    <a href="loja.html">Store</a>
    <a href="links.html">Social</a>
  </div>

  <!-- VITRINE DE PRODUTOS -->
  <div class="store-container">
    
    <!-- PRODUTO 1 -->
    <div class="product-card" onclick="abrirProduto('camiseta_retro.bmp', 'R$ 49,90', 'foto_quebrada1.png', 'https://mercadolivre.com.br/seu-produto')">
      <!-- Título em formato de Arquivo -->
      <div class="card-title-bar">
        <span>camiseta.bmp</span>
      </div>
      <div class="card-content">
        <div class="img-container">
          <img src="foto_quebrada1.png" alt="Produto 1">
        </div>
        <p class="product-desc">Camiseta de algodão com estampa em pixel art.</p>
        <p class="product-price-card">R$ 49,90</p>
      </div>
    </div>

    <!-- PRODUTO 2 -->
    <div class="product-card" onclick="abrirProduto('adesivos_90s.zip', 'R$ 15,00', 'foto_quebrada2.png', 'https://shopee.com.br/seu-produto')">
      <!-- Título em formato de Arquivo -->
      <div class="card-title-bar">
        <span>adesivos.zip</span>
      </div>
      <div class="card-content">
        <div class="img-container">
          <img src="foto_quebrada2.png" alt="Produto 2">
        </div>
        <p class="product-desc">Cartela de adesivos inspirada em sistemas antigos.</p>
        <p class="product-price-card">R$ 15,00</p>
      </div>
    </div>

    <!-- PRODUTO 3 -->
    <div class="product-card" onclick="abrirProduto('mousepad_disquete.exe', 'R$ 35,50', 'foto_quebrada3.png', 'https://mercadolivre.com.br/seu-produto')">
      <!-- Título em formato de Arquivo -->
      <div class="card-title-bar">
        <span>mousepad.exe</span>
      </div>
      <div class="card-content">
        <div class="img-container">
          <img src="foto_quebrada3.png" alt="Produto 3">
        </div>
        <p class="product-desc">Mousepad quadrado perfeito para o seu setup.</p>
        <p class="product-price-card">R$ 35,50</p>
      </div>
    </div>

  </div>

  <!-- FUNDO ESCURO E POP-UP DO PRODUTO -->
  <div class="modal-overlay" id="overlayProduto">
    
    <div class="retro-popup">
      <div class="title-bar">
        <span id="popupTitulo">produto.exe</span>
        
        <div class="botoes-janela">
          <div class="botao">
            <img src="minimizar.png" alt="Minimizar">
          </div>
          <div class="botao">
            <img src="maximizar.png" alt="Expandir">
          </div>
          <div class="botao fechar" onclick="fecharProduto()">
            <img src="fechar.png" alt="Fechar">
          </div>
        </div>
      </div>

      <div class="popup-content">
        <img id="popupImg" src="" alt="Imagem do Produto">
        <div class="popup-price" id="popupPreco">R$ 0,00</div>
        
        <a id="popupLink" href="#" target="_blank" class="btn-comprar">Comprar Agora 🛒</a>
      </div>
    </div>

  </div>

  <!-- SCRIPT -->
  <script>
    function abrirProduto(titulo, preco, imagem, link) {
      // Puxa o título diretamente com a extensão (ex: camiseta.bmp)
      document.getElementById("popupTitulo").innerText = titulo;
      document.getElementById("popupPreco").innerText = preco;
      document.getElementById("popupImg").src = imagem;
      document.getElementById("popupLink").href = link;
      
      document.getElementById("overlayProduto").style.display = "flex";
    }

    function fecharProduto() {
      document.getElementById("overlayProduto").style.display = "none";
    }
  </script>

</body>
</html>
